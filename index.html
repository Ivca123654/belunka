<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bělunka a ztracené světýlko</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#080b1c,#17113a 55%,#05050d);color:#f8f7ff;min-height:100vh}.app{max-width:520px;margin:auto;padding:22px}.center{text-align:center}.ghost{font-size:88px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 18px #bba8ff)}@keyframes float{50%{transform:translateY(-10px)}}h1{font-size:34px;margin:8px 0}.tag{color:#c4b5fd;font-size:12px;letter-spacing:3px;text-transform:uppercase}.card{background:#101426e8;border:1px solid #6d5aad77;border-radius:24px;padding:20px;margin-top:18px;box-shadow:0 20px 50px #0006}.story{color:#d5d3df;line-height:1.6}.belunka{display:flex;gap:12px;background:#291657aa;padding:15px;border-radius:18px;margin-top:16px}.belunka .face{font-size:38px}.small{font-size:12px;color:#bba8ff;font-weight:700}.btn{border:0;border-radius:15px;padding:14px 16px;font-weight:700;font-size:16px;cursor:pointer}.primary{background:#7c3aed;color:white;width:100%;margin-top:16px}.secondary{background:#272838;color:#eee}.sound{width:100%;margin-top:15px;background:transparent;border:1px solid #8b7bd7;color:#eee}.riddle{background:#050712aa;border-radius:18px;padding:16px;margin-top:18px}.riddle label{color:#fde68a}.answer{width:100%;margin-top:14px;background:#080b14;border:1px solid #555b70;color:#fff;border-radius:13px;padding:14px;font-size:16px}.row{display:flex;gap:9px;margin-top:10px}.row .btn{flex:1}.msg{font-size:14px;margin-top:12px}.good{color:#fde68a}.bad{color:#fda4af}.letter{text-align:center;font-size:62px;font-weight:900;color:#fde68a;text-shadow:0 0 20px #fde68a;margin-top:12px}.progress{display:flex;gap:6px;margin:12px 0}.dot{height:7px;flex:1;background:#41435a;border-radius:20px}.dot.on{background:#fde68a;box-shadow:0 0 8px #fde68a}.dot.now{background:#a78bfa}.top{display:flex;justify-content:space-between;align-items:center}.link{background:none;border:0;color:#ccc;padding:8px;cursor:pointer}.final{text-align:center;border:1px solid #fde68a88;background:linear-gradient(135deg,#fde68a1d,#8b5cf62b)}.lantern{font-size:76px;animation:glow 2s infinite}@keyframes glow{50%{filter:drop-shadow(0 0 25px #fde68a);transform:scale(1.08)}}.hidden{display:none}.lightword{letter-spacing:6px;color:#fde68a;font-weight:800}.hint{color:#aaa;font-size:14px;margin-top:10px}
</style></head><body><main id="app" class="app"></main>
<script>
const stops=[
["Zhasnutá lucerna","🏮","Bělunčina lucerna je úplně studená. V mechu pod ní se ale třpytí první ztracené světýlko.","Večer mě rozsvítíš, v ruce mě můžeš nést. Zaháním tmu, ale nejsem slunce. Co jsem?","LUCERNA","Bývá v ní svíčka nebo malé světlo.","S","Moje lucerna! Ještě pořád nesvítí… Pomůžeš mi najít první světýlko?"],
["Šeptající les","🌲","Větve se sklánějí nad cestou a listí tiše šeptá: ‚Vraťte se…‘ Bělunka se schová za tebe, ale zase vykoukne.","Mám kmen, větve a listy, ale nemám ruce ani nohy. Co jsem?","STROM","Rostu v lese a sahám k obloze.","V","Slyšíš to taky? Když jdeš ty, půjdu taky!"],
["Dýňový strážce","🎃","Cestu zahrazuje veliká svítící dýně. Vypadá přísně, ale ve skutečnosti se jen nudí.","Jsem oranžová a kulatá. Na podzim ze mě bývá svítící strašidlo. Co jsem?","DÝNĚ","Mohu mít vyřezané oči a zubatý úsměv.","Ě","Jé, ta se ale mračí! Myslím, že je spíš legrační než strašidelná."],
["Kostlivec Hugo","💀","Z křoví se ozve: křup, chrast, křup! Kostlivec Hugo už sto let hledá jednu zatoulanou kost.","Nemám kůži ani svaly, přesto držím tělo pohromadě. Co jsem?","KOSTRA","Skládám se z mnoha kostí.","T","Hugo je pěkně popletený. Pomůžeme mu?"],
["Havraní rozcestí","🐦‍⬛","Cesta se dělí na dvě. Na starém ukazateli sedí černý havran, který zná správný směr.","Jsem černý pták, hlasitě krákám a v pohádkách hlídám tajemství. Kdo jsem?","HAVRAN","Moje volání zní: krááá!","Ý","Krááá! Takhle asi mluví havrani. Myslíš, že nám rozuměl?"],
["Pavučinový les","🕷️","Mezi stromy se lesknou stříbrné pavučiny. Malý pavouk Péťa poctivě hlídá další světýlko.","Mám osm nohou, ale žádné boty. Z tenkých vláken si stavím síť. Kdo jsem?","PAVOUK","Bydlím v pavučině.","L","Péťa vypadá mile… jen má trochu moc nožiček."],
["Tajemný klíč","🗝️","Pod kamenem leží starý zlatý klíč. Otevírá Bránu mezi světy.","Mám zuby, ale nekoušu. Otevírám to, co je zamčené. Co jsem?","KLÍČ","Patřím k zámku.","K","Už vím, kde jsme! Za další zatáčkou je brána domů."],
["Brána mezi světy","🌙","Před tebou září brána zahalená mlhou. Chybí už jen poslední jiskřička.","Objevuji se po dešti, mám sedm barev a tvořím oblouk přes oblohu. Co jsem?","DUHA","Najdeš na mně červenou, žlutou, zelenou i modrou.","O","To je ona! Poslední brána. Rozsvítíme moji lucernu?"]];
let solved=JSON.parse(localStorage.getItem('belunkaSolved')||'{}');
let current=+(new URLSearchParams(location.search).get('stanoviste')||1); if(current<1||current>8)current=1;
const app=document.getElementById('app');
const norm=s=>(s||'').trim().toLocaleUpperCase('cs-CZ');
function save(){localStorage.setItem('belunkaSolved',JSON.stringify(solved))}
function sound(){let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A(),m=c.createGain();m.gain.setValueAtTime(.0001,c.currentTime);m.gain.exponentialRampToValueAtTime(.12,c.currentTime+.08);m.gain.exponentialRampToValueAtTime(.0001,c.currentTime+2);m.connect(c.destination);[164,220,277].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.type=i?'triangle':'sine';o.frequency.setValueAtTime(f,c.currentTime);o.frequency.exponentialRampToValueAtTime(f*.72,c.currentTime+1.9);g.gain.value=i?.15:.7;o.connect(g);g.connect(m);o.start();o.stop(c.currentTime+2.1)})}
function intro(){app.innerHTML=`<div class="center"><div class="ghost">👻</div><div class="tag">Pohádková noční stezka</div><h1>Bělunka a ztracené světýlko</h1></div><div class="card story"><p>Jednou za rok se malé dušičky vydávají na návštěvu do světa lidí. Musí se však vrátit dřív, než zhasne <b>Poslední lucerna</b>.</p><p>Malá Bělunka zaspala a její kouzelná lucerna se rozpadla na <b>osm světýlek</b>. Ta se rozutekla po tajemném lese.</p><p style="color:#fde68a">Pomůžeš Bělunce světýlka najít a ukázat jí cestu domů?</p></div><button class="btn primary" onclick="game(${current})">Jdu do toho ›</button>`}
function game(n){current=n;let s=stops[n-1],done=!!solved[n];history.replaceState(null,'',`?stanoviste=${n}`);let dots=stops.map((_,i)=>`<span class="dot ${solved[i+1]?'on':i+1===n?'now':''}"></span>`).join('');app.innerHTML=`<div class="top"><button class="link" onclick="intro()">← Úvod</button><span class="tag">SVĚTÝLKO ${Object.keys(solved).length}/8</span></div><div class="progress">${dots}</div><div class="card"><div style="display:flex;gap:16px;align-items:center"><div style="font-size:58px">${s[1]}</div><div><div class="tag">Stanoviště ${n} z 8</div><h2 style="margin:4px 0">${s[0]}</h2></div></div><p class="story">${s[2]}</p><div class="belunka"><div class="face">👻</div><div><div class="small">BĚLUNKA</div><div>„${s[7]}“</div></div></div><button class="btn sound" onclick="sound()">🔊 Pustit tajemný zvuk</button><div class="riddle"><label>💡 Hádanka</label><p>${s[3]}</p>${done?`<div class="letter">${s[6]}</div><div class="center good">Světýlko nalezeno!</div>`:`<input id="ans" class="answer" placeholder="Napiš odpověď…"><div class="row"><button class="btn primary" style="margin-top:0" onclick="check()">Zkontrolovat</button><button class="btn secondary" onclick="hint()">Nápověda</button></div><div id="hint" class="hint hidden">💡 ${s[5]}</div><div id="msg" class="msg"></div>`}</div></div>${Object.keys(solved).length===8?finalHtml():''}`;let a=document.getElementById('ans');if(a)a.addEventListener('keydown',e=>{if(e.key==='Enter')check()})}
function hint(){document.getElementById('hint').classList.remove('hidden')}
function check(){let s=stops[current-1],a=document.getElementById('ans').value,m=document.getElementById('msg');if(norm(a)===norm(s[4])){solved[current]=true;save();game(current)}else{m.className='msg bad';m.textContent='To ještě není ono. Zkus to znovu nebo použij nápovědu.'}}
function finalHtml(){return `<div class="card final"><div class="lantern">🏮</div><div class="lightword">SVĚTÝLKO</div><h2>Dokázali jste to!</h2><p>Bělunčina lucerna znovu svítí a ukazuje jí cestu domů.</p><p style="color:#c4b5fd">„Až se příští rok v podzimní mlze mihne malé světlo, možná vám mávám já. Děkuji, odvážlivci!“</p><h2 style="color:#fde68a">🍬 ODMĚNA ODEMČENA</h2></div>`}
intro();
</script></body></html>
